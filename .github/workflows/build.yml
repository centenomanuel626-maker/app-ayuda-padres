name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Revisar el código
        run: gradle compileReleaseKotlin --no-daemon

      - name: Comprobar la llave de firma
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Compilar el APK firmado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk app-ayuda-padres.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-ayuda-padres
          path: app-ayuda-padres.apk

      # Publica cada versión con un enlace fijo para mandar por WhatsApp:
      # https://github.com/<usuario>/app-ayuda-padres/releases/latest/download/app-ayuda-padres.apk
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" app-ayuda-padres.apk \
            --title "Versión 1.0.${{ github.run_number }}" \
            --notes "APK para instalar en los celulares de la familia." \
            --latest
